name: NuGet Publish Workflow

# Defines the triggers for this workflow
on:
  # 1. Automatic Trigger (Recommended): Runs when a new tag like 'v1.2.3' is pushed.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-**' # Also handles pre-release tags like v1.0.0-beta1

  # 2. Manual Trigger: Adds a "Run workflow" button to the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.1 or 1.0.1-preview)'
        required: true
      target:
        description: 'Package to publish'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - core
          - wpf
        
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x' 

    # --- Determine the Package Version ---
    - name: Get Version from Tag or Manual Input
      id: get_version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
        else
          VERSION="${{ github.event.inputs.version }}"
        fi
        echo "PACKAGE_VERSION=$VERSION" >> $GITHUB_OUTPUT
            
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build project (Release)
      run: dotnet build --configuration Release
      
    - name: Run unit tests
      run: dotnet test tests/Luminy.Tests/Luminy.Tests.csproj --configuration Release --no-build

    - name: Build and Pack NuGet packages
      run: |
        TARGET="${{ github.event.inputs.target || 'all' }}"
        VERSION="${{ steps.get_version.outputs.PACKAGE_VERSION }}"
        
        if [ "$TARGET" = "all" ] || [ "$TARGET" = "core" ]; then
          echo "Packaging Luminy (Core)..."
          dotnet pack src/Luminy/Luminy.csproj --configuration Release --no-build --output ./nupkg /p:Version="$VERSION"
        fi
        
        if [ "$TARGET" = "all" ] || [ "$TARGET" = "wpf" ]; then
          echo "Packaging Luminy.Wpf..."
          dotnet pack src/Luminy.Wpf/Luminy.Wpf.csproj --configuration Release --no-build --output ./nupkg /p:Version="$VERSION"
        fi
      
    - name: NuGet Login (Trusted Publishing)
      id: nuget_login
      continue-on-error: true
      uses: NuGet/login@v1
      with:
        user: Samuel-Vidal

    - name: Publish to NuGet.org
      run: |
        API_KEY="${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
        if [ -z "$API_KEY" ]; then
          API_KEY="${{ secrets.NUGET_API_KEY }}"
        fi
        dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$API_KEY" --skip-duplicate